<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance-Style Multi-Trade Planner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind Config for Binance Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        binance: {
                            bg: '#0b0e11',       /* Main dark background */
                            card: '#1e2329',     /* Card background */
                            border: '#2b3139',   /* Subtler borders */
                            borderHover: '#474d57', /* Border on hover */
                            text: '#eaecef',     /* Primary text */
                            muted: '#848e9c',    /* Secondary/muted text */
                            yellow: '#fcd535',   /* Binance Yellow */
                            yellowHover: '#f0c722',
                            green: '#0ecb81',    /* Buy/Long Green */
                            red: '#f6465d'       /* Sell/Short Red */
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom sleek scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0e11; } 
        ::-webkit-scrollbar-thumb { background: #2b3139; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #474d57; }
        
        /* Hide number input arrows cleanly */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        /* Custom selection color */
        ::selection { background: rgba(252, 213, 53, 0.2); }
    </style>
</head>
<body class="bg-binance-bg text-binance-text min-h-screen flex flex-col antialiased">

    <!-- Top Navigation / Header -->
    <header class="bg-binance-card border-b border-binance-border sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="text-binance-yellow">
                    <i data-lucide="layout-dashboard" class="w-6 h-6 fill-current"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-binance-text leading-tight">Cross Portfolio Planner</h1>
                    <p class="text-[11px] text-binance-muted font-medium mt-0.5">Strategize multiple trades without liquidation</p>
                </div>
            </div>

            <!-- Global Wallet Balance -->
            <div class="flex items-center gap-3">
                <div class="bg-binance-bg px-4 py-2 rounded-lg border border-binance-border focus-within:border-binance-yellow transition-colors flex items-center justify-between gap-3 min-w-[240px]">
                    <div class="flex flex-col">
                        <label class="text-[10px] font-semibold text-binance-muted">Total Wallet Balance</label>
                        <div class="flex items-center gap-1 mt-0.5">
                            <input type="number" step="any" id="global-wallet" value="10000" oninput="updateWalletInput(this.value)" class="w-full bg-transparent text-lg font-bold text-binance-text focus:outline-none placeholder-binance-muted font-mono" placeholder="10000" />
                        </div>
                    </div>
                    <span class="text-sm font-semibold text-binance-muted">USDT</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 pb-36">
        
        <!-- Controls -->
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <h2 class="text-xl font-bold text-binance-text">Positions</h2>
                <span class="bg-binance-border text-binance-text text-xs font-bold px-2 py-0.5 rounded"><span id="trade-count">1</span></span>
            </div>
            <button onclick="addTrade()" class="bg-binance-yellow hover:bg-binance-yellowHover text-black px-4 py-2 rounded text-sm font-bold transition-colors flex items-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i> Add Trade
            </button>
        </div>

        <!-- Trades Grid -->
        <div id="trades-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Trade Cards injected via JS -->
        </div>

    </main>

    <!-- Sticky Bottom Summary Bar -->
    <div class="bg-binance-card fixed bottom-0 left-0 w-full border-t border-binance-border p-4 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="flex w-full md:w-auto items-center gap-6 bg-binance-bg px-5 py-2.5 rounded-lg border border-binance-border">
                <!-- Margin Usage -->
                <div>
                    <p class="text-[10px] font-semibold text-binance-muted mb-0.5">Available Margin (USDT)</p>
                    <p id="summary-available" class="text-base font-bold font-mono text-binance-green">0.00</p>
                </div>
                <div class="h-8 w-px bg-binance-border"></div>
                <div>
                    <p class="text-[10px] font-semibold text-binance-muted mb-0.5">Used Margin (USDT)</p>
                    <p id="summary-used" class="text-base font-bold font-mono text-binance-text">0.00</p>
                </div>
            </div>

            <!-- Total PNL -->
            <div class="w-full md:w-auto flex items-center justify-between md:justify-end gap-6 bg-binance-bg py-2.5 px-5 rounded-lg border border-binance-border">
                <span class="text-sm font-semibold text-binance-muted">Total Projected PNL</span>
                <div class="flex items-center gap-1">
                    <span id="summary-pnl" class="text-xl font-bold font-mono text-binance-text">0.00</span>
                    <span class="text-sm font-bold text-binance-muted">USDT</span>
                </div>
            </div>
            
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // State Management
        let walletBalance = "10000";
        let tradeIdCounter = 0;
        let trades = [];

        const MMR = 0.005; // Standard 0.5% Maintenance Margin Rate approximation

        // DOM Elements
        const elTradesContainer = document.getElementById('trades-container');
        const elTradeCount = document.getElementById('trade-count');
        const elSummaryAvailable = document.getElementById('summary-available');
        const elSummaryUsed = document.getElementById('summary-used');
        const elSummaryPnl = document.getElementById('summary-pnl');

        // Initialize Icons
        function initIcons() {
            lucide.createIcons();
        }

        // ==========================================
        // STATE UPDATERS
        // ==========================================

        function updateWalletInput(val) {
            walletBalance = val;
            refreshCalculations(); // Only update numbers, do not re-render DOM
        }

        function addTrade() {
            tradeIdCounter++;
            trades.push({
                id: tradeIdCounter,
                symbol: `BTCUSDT`,
                mode: 'cross', // cross | isolated
                type: 'long',  // long | short
                cost: "1000",
                leverage: "10",
                entry: "65000",
                exit: "70000"
            });
            renderAll(); // Re-render DOM because a new element was added
        }

        function removeTrade(id) {
            trades = trades.filter(t => t.id !== id);
            renderAll(); // Re-render DOM because an element was removed
        }

        // For Text Inputs: Updates array and recalculates numbers WITHOUT redrawing the input element
        function updateTradeInput(id, field, value) {
            const trade = trades.find(t => t.id === id);
            if (trade) {
                trade[field] = value;
                refreshCalculations();
            }
        }

        // For Select Dropdowns: Updates array and re-draws the card so UI styles change instantly
        function updateTradeSelect(id, field, value) {
            const trade = trades.find(t => t.id === id);
            if (trade) {
                trade[field] = value;
                renderAll(); 
            }
        }

        // ==========================================
        // CORE CALCULATION ENGINE
        // ==========================================
        function calculate() {
            const parsedWallet = parseFloat(walletBalance) || 0;
            
            // 1. Calculate Total Used Margin
            let totalUsedMargin = trades.reduce((sum, t) => sum + (parseFloat(t.cost) || 0), 0);
            let availableBalance = parsedWallet - totalUsedMargin;

            let totalPnl = 0;

            // 2. Calculate per-trade metrics
            const computedTrades = trades.map(t => {
                const cost = parseFloat(t.cost) || 0;
                const lev = parseFloat(t.leverage) || 0;
                const ent = parseFloat(t.entry) || 0;
                const ex = parseFloat(t.exit) || 0;

                let notional = cost * lev;
                let size = ent > 0 ? notional / ent : 0;
                
                let pnl = 0;
                let roe = 0;
                let liqPrice = 0;

                // PNL & ROE
                if (size > 0 && ex > 0) {
                    pnl = t.type === 'long' ? (ex - ent) * size : (ent - ex) * size;
                    roe = cost > 0 ? (pnl / cost) * 100 : 0;
                    totalPnl += pnl;
                }

                // Liquidation Price
                if (size > 0) {
                    let effectiveMargin = t.mode === 'cross' ? (cost + Math.max(0, availableBalance)) : cost;
                    
                    if (t.type === 'long') {
                        liqPrice = (ent * size - effectiveMargin) / (size * (1 - MMR));
                        if (liqPrice < 0) liqPrice = 0; 
                    } else {
                        liqPrice = (ent * size + effectiveMargin) / (size * (1 + MMR));
                    }
                }

                return { ...t, pnl, roe, liqPrice };
            });

            return { availableBalance, totalUsedMargin, totalPnl, computedTrades };
        }

        // ==========================================
        // UI RENDERING & UPDATING
        // ==========================================

        function refreshCalculations() {
            const data = calculate();
            
            // Update Global Summaries
            elSummaryAvailable.innerText = `${data.availableBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            elSummaryAvailable.className = `text-base font-bold font-mono ${data.availableBalance >= 0 ? 'text-binance-green' : 'text-binance-red'}`;
            
            elSummaryUsed.innerText = `${data.totalUsedMargin.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            
            elSummaryPnl.innerText = `${data.totalPnl >= 0 ? '+' : ''}${data.totalPnl.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            elSummaryPnl.className = `text-xl font-bold font-mono ${data.totalPnl >= 0 ? 'text-binance-green' : 'text-binance-red'}`;

            // Update individual trade result nodes
            data.computedTrades.forEach(t => {
                const elLiq = document.getElementById(`liq-${t.id}`);
                const elPnl = document.getElementById(`pnl-${t.id}`);
                const elRoe = document.getElementById(`roe-${t.id}`);

                if (elLiq) {
                    elLiq.innerText = t.liqPrice > 0 ? t.liqPrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4}) : '--';
                    elLiq.className = `text-lg font-bold font-mono ${t.liqPrice > 0 ? 'text-binance-yellow' : 'text-binance-muted'}`;
                }
                
                if (elPnl) {
                    elPnl.innerText = `${t.pnl >= 0 ? '+' : ''}${t.pnl.toFixed(2)}`;
                    elPnl.className = `text-base font-bold font-mono ${t.pnl >= 0 ? 'text-binance-green' : 'text-binance-red'}`;
                }

                if (elRoe) {
                    elRoe.innerText = `${t.roe >= 0 ? '+' : ''}${t.roe.toFixed(2)}%`;
                    elRoe.className = `text-sm font-bold font-mono ${t.roe >= 0 ? 'text-binance-green' : 'text-binance-red'}`;
                }
            });
        }

        function renderAll() {
            elTradeCount.innerText = trades.length;

            elTradesContainer.innerHTML = trades.map(t => {
                
                const isLong = t.type === 'long';
                // Binance uses subtle background tints for dropdowns or text colors
                const typeTextClass = isLong ? 'text-binance-green' : 'text-binance-red';

                return `
                <div class="bg-binance-card border border-binance-border rounded-lg overflow-hidden flex flex-col transition-colors hover:border-binance-borderHover">
                    
                    <!-- Card Header -->
                    <div class="p-3 border-b border-binance-border flex items-center justify-between gap-2">
                        <input type="text" value="${t.symbol}" oninput="updateTradeInput(${t.id}, 'symbol', this.value)" class="bg-transparent font-bold text-binance-text text-base w-24 focus:outline-none placeholder-binance-muted uppercase" placeholder="Symbol" />
                        
                        <div class="flex items-center gap-2 flex-1 justify-end">
                            <!-- Mode Toggle -->
                            <select onchange="updateTradeSelect(${t.id}, 'mode', this.value)" class="bg-binance-bg border border-binance-border text-xs font-semibold text-binance-text rounded px-2 py-1 focus:outline-none focus:border-binance-yellow cursor-pointer">
                                <option value="cross" ${t.mode === 'cross' ? 'selected' : ''}>Cross</option>
                                <option value="isolated" ${t.mode === 'isolated' ? 'selected' : ''}>Isolated</option>
                            </select>
                            
                            <!-- Type Toggle -->
                            <select onchange="updateTradeSelect(${t.id}, 'type', this.value)" class="bg-binance-bg border border-binance-border text-xs font-bold rounded px-2 py-1 focus:outline-none cursor-pointer ${typeTextClass}">
                                <option value="long" class="text-binance-green" ${t.type === 'long' ? 'selected' : ''}>Long</option>
                                <option value="short" class="text-binance-red" ${t.type === 'short' ? 'selected' : ''}>Short</option>
                            </select>

                            <button onclick="removeTrade(${t.id})" class="text-binance-muted hover:text-binance-red p-1 rounded transition-colors ml-1" title="Remove Trade">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Card Body (Inputs) -->
                    <div class="p-4 grid grid-cols-2 gap-x-3 gap-y-4">
                        <div class="flex flex-col">
                            <label class="text-[11px] text-binance-muted mb-1">Margin (USDT)</label>
                            <input type="number" step="any" value="${t.cost}" oninput="updateTradeInput(${t.id}, 'cost', this.value)" class="w-full bg-binance-bg border border-binance-border hover:border-binance-borderHover rounded px-3 py-1.5 text-sm font-mono text-binance-text focus:border-binance-yellow focus:outline-none transition-colors" />
                        </div>
                        <div class="flex flex-col">
                            <label class="text-[11px] text-binance-muted mb-1">Leverage (x)</label>
                            <input type="number" step="any" value="${t.leverage}" oninput="updateTradeInput(${t.id}, 'leverage', this.value)" class="w-full bg-binance-bg border border-binance-border hover:border-binance-borderHover rounded px-3 py-1.5 text-sm font-mono text-binance-text focus:border-binance-yellow focus:outline-none transition-colors" />
                        </div>
                        <div class="flex flex-col">
                            <label class="text-[11px] text-binance-muted mb-1">Entry Price</label>
                            <input type="number" step="any" value="${t.entry}" oninput="updateTradeInput(${t.id}, 'entry', this.value)" class="w-full bg-binance-bg border border-binance-border hover:border-binance-borderHover rounded px-3 py-1.5 text-sm font-mono text-binance-text focus:border-binance-yellow focus:outline-none transition-colors" />
                        </div>
                        <div class="flex flex-col">
                            <label class="text-[11px] text-binance-muted mb-1">Target Exit</label>
                            <input type="number" step="any" value="${t.exit}" oninput="updateTradeInput(${t.id}, 'exit', this.value)" class="w-full bg-binance-bg border border-binance-border hover:border-binance-borderHover rounded px-3 py-1.5 text-sm font-mono text-binance-text focus:border-binance-yellow focus:outline-none transition-colors" />
                        </div>
                    </div>

                    <!-- Card Footer (Results) -->
                    <div class="bg-binance-bg border-t border-binance-border p-4 mt-auto">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-[11px] text-binance-muted underline decoration-dashed decoration-binance-border underline-offset-4 cursor-help" title="Estimated Liquidation Price">Est. Liq. Price</span>
                            <span id="liq-${t.id}" class="text-lg font-bold font-mono text-binance-muted">--</span>
                        </div>
                        
                        <div class="flex justify-between items-center pt-3 border-t border-binance-border">
                            <div class="flex flex-col">
                                <span class="text-[11px] text-binance-muted mb-0.5">Est. PNL (USDT)</span>
                                <span id="pnl-${t.id}" class="text-base font-bold font-mono">--</span>
                            </div>
                            <div class="flex flex-col items-end">
                                <span class="text-[11px] text-binance-muted mb-0.5">Est. ROE</span>
                                <span id="roe-${t.id}" class="text-sm font-bold font-mono">--</span>
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');

            refreshCalculations();
            initIcons();
        }

        // Initial Boot
        addTrade(); 
    </script>
</body>
</html>
